name: offline_notes
description: "Offline-first notes app (Flutter rewrite) with local persistence and client-only sync using LWW conflict resolution."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.2
  sqflite: ^2.4.2
  uuid: ^4.3.3
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
